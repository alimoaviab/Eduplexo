user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                    'reqid="$http_x_request_id"';

    # Same as `main` but logs $uri instead of $request — used for the /ws
    # endpoint so JWTs passed in the query string never reach the access log.
    log_format main_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_x_forwarded_for" '
                           'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/css
        text/plain
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Request Body Limit (Accommodates CSV imports up to 10MB + metadata)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=1200r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;
    limit_req_status 429;

    # ─── CORS for nginx-generated responses ────────────────────────────────
    # The Go backend's chi CORS middleware decorates every response that
    # passes through the app, but nginx-generated responses (rate-limit 429,
    # upstream 502/503/504, proxy timeouts) never touch the Go stack and
    # therefore lack Access-Control-Allow-* headers. For the cross-origin
    # Vercel frontend this makes the browser reject those responses at the
    # CORS layer: fetch() throws TypeError and the app reports a bogus
    # "Unable to reach the server" error. Map the allowlisted frontend
    # origins and emit CORS headers on every response (see `always` below).
    map $http_origin $cors_origin {
        default "";
        "https://app.eduplexo.com"      "https://app.eduplexo.com";
        "https://admin.eduplexo.com"    "https://admin.eduplexo.com";
        "https://partners.eduplexo.com" "https://partners.eduplexo.com";
        "https://eduplexo.com"          "https://eduplexo.com";
        "https://www.eduplexo.com"      "https://www.eduplexo.com";
        "http://localhost:3000"         "http://localhost:3000";
        "http://localhost:3001"         "http://localhost:3001";
        "http://localhost:3002"         "http://localhost:3002";
        "http://localhost:3003"         "http://localhost:3003";
        "http://localhost:3004"         "http://localhost:3004";
        "http://localhost:5173"         "http://localhost:5173";
    }

    # Upstream Definitions — Core API
    upstream backend_upstream {
        server backend-go:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ─── PRESERVED FOR FUTURE AI ACTIVATION: Edubot Upstream ─────────────
    # To activate Edubot:
    # 1. Start the edubot container in docker-compose.prod.yml
    # 2. Uncomment the upstream block below:
    # upstream edubot_upstream {
    #     server edubot:8001 max_fails=3 fail_timeout=10s;
    #     keepalive 16;
    # }

    # ──────────────────────────────────────────────────────────────────────────
    # HTTP (Port 80): ACME Challenge & Global HTTPS Redirect
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name api.eduplexo.com;
        # Future AI: add bot.eduplexo.com when activating Edubot

        # Let's Encrypt / Certbot Webroot Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Nginx container healthcheck
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Permanent redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # HTTPS (Port 443): Core API Service (api.eduplexo.com)
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.eduplexo.com;

        # SSL Certificates (managed via Certbot)
        ssl_certificate /etc/letsencrypt/live/api.eduplexo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.eduplexo.com/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Modern TLS Security Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # CORS is handled by ONE authoritative layer at the edge: nginx. The Go
        # backend's chi CORS middleware is still enabled (it is the CORS layer
        # for direct/non-nginx deployments), but at this proxy the upstream's
        # Access-Control-Allow-* headers are stripped with proxy_hide_header so
        # they are never duplicated, and nginx emits a single set on EVERY
        # response — including nginx-generated errors (rate-limit 429,
        # upstream 502/503/504, proxy timeouts) that never reach the Go stack.
        # Without this, browsers reject the response at the CORS layer with
        # "multiple values" errors and fetch() surfaces a bogus network error.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        # `always` makes these apply to every response code. An empty
        # $cors_origin (non-allowlisted or absent Origin) emits an empty value,
        # which browsers treat the same as a missing header.
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Expose-Headers "Content-Length" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Academic-Year-Id, X-School-Id, X-Branch-Id, X-Campus-Id" always;
        add_header Access-Control-Max-Age "300" always;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket Connection Proxying (/ws)
        location /ws {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # The client passes its JWT in the query string; never log it.
            access_log /var/log/nginx/ws_access.log main_noquery;
        }

        # Rate-limited Authentication Endpoints
        location = /api/auth/login {
            limit_req zone=auth_limit burst=15 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
        }

        location = /api/auth/signup {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 30s;
        }

        # Chatbot Route Handling on API domain
        # In current release (Edubot dormant), returns clean 503 status
        # When activating Edubot: uncomment proxy_pass to http://edubot_upstream
        location /chat/ {
            # proxy_pass http://edubot_upstream;
            default_type application/json;
            return 503 '{"error":"Edubot AI service is dormant in this deployment"}';
        }

        location /public-chat/ {
            # proxy_pass http://edubot_upstream;
            default_type application/json;
            return 503 '{"error":"Edubot AI service is dormant in this deployment"}';
        }

        # Prometheus Telemetry Metric Restriction
        location /metrics {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
        }

        # Core API Endpoints
        location / {
            limit_req zone=api_general burst=150 nodelay;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # PRESERVED FOR FUTURE AI ACTIVATION: bot.eduplexo.com (Port 443)
    # ──────────────────────────────────────────────────────────────────────────
    # To activate:
    # 1. Ensure bot.eduplexo.com DNS points to Contabo VPS IP
    # 2. Add -d bot.eduplexo.com to Certbot in scripts/deploy.sh
    # 3. Uncomment the upstream edubot_upstream above
    # 4. Uncomment the server block below
    #
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name bot.eduplexo.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/api.eduplexo.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/api.eduplexo.com/privkey.pem;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_tickets off;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header X-Frame-Options DENY always;
    #     add_header Referrer-Policy strict-origin-when-cross-origin always;
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    #
    #     location / {
    #         proxy_pass http://edubot_upstream;
    #         proxy_http_version 1.1;
    #         proxy_set_header Connection "";
    #         proxy_buffering off;
    #         proxy_cache off;
    #         proxy_read_timeout 300s;
    #         proxy_send_timeout 300s;
    #         chunked_transfer_encoding on;
    #     }
    # }
}
